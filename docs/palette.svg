<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Artemis Surface Stays visual palette</title><desc id="desc">The site's background, ink, accent, and secondary colors with its display typography.</desc><rect width="1200" height="300" fill="#000000"/><path d="M40 36H1160M40 272H1160" stroke="#707986" stroke-opacity=".7"/><text x="54" y="69" fill="#707986" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">VISUAL LANGUAGE / MOON</text><text x="54" y="166" fill="#ff5b14" font-family="Georgia,serif" font-style="italic" font-size="51">Artemis Surface Stays</text><text x="54" y="220" fill="#f4f3f0" font-family="Arial,sans-serif" font-size="20">Seven days at the lunar south pole</text><text x="54" y="254" fill="#707986" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.2">SPACE GROTESK · BARLOW CONDENSED</text><g transform="translate(800 93)"><rect width="76" height="76" fill="#000000" stroke="#707986"/><rect x="90" width="76" height="76" fill="#f4f3f0"/><rect x="180" width="76" height="76" fill="#ff5b14"/><rect x="270" width="76" height="76" fill="#707986"/><g fill="#707986" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5"><text x="0" y="96">GROUND</text><text x="90" y="96">INK</text><text x="180" y="96">ACCENT</text><text x="270" y="96">SECOND</text></g></g></svg>