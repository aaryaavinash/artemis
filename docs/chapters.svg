<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">Four scenes from Artemis Surface Stays</title><desc id="desc">Four illustrated chapter cards for the project's main themes.</desc><rect width="1200" height="380" fill="#000000"/><path d="M40 40H1160M40 347H1160" stroke="#707986" stroke-opacity=".8"/><path d="M320 40V347" stroke="#707986" stroke-opacity=".55"/><text x="55" y="67" fill="#707986" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 01</text><circle cx="180" cy="173" r="68" fill="none" stroke="#ff5b14" stroke-opacity=".7" stroke-width="2"/><circle cx="180" cy="173" r="46" fill="none" stroke="#707986" stroke-opacity=".65"/><path d="M180 106V240M113 173H247" stroke="#ff5b14" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="180" cy="173" r="17" fill="#ff5b14"/> --><text x="180" y="191" text-anchor="middle" fill="#ff5b14" font-family="Georgia,serif" font-size="54" font-style="italic">T</text><text x="55" y="281" fill="#f4f3f0" font-family="Georgia,serif" font-style="italic" font-size="22">Touchdown</text><text x="55" y="307" fill="#707986" font-family="Arial,sans-serif" font-size="11">The horizon is lower than</text><text x="55" y="325" fill="#707986" font-family="Arial,sans-serif" font-size="11">expected.</text><path d="M600 40V347" stroke="#707986" stroke-opacity=".55"/><text x="335" y="67" fill="#707986" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 02</text><circle cx="460" cy="173" r="68" fill="none" stroke="#ff5b14" stroke-opacity=".7" stroke-width="2"/><circle cx="460" cy="173" r="46" fill="none" stroke="#707986" stroke-opacity=".65"/><path d="M460 106V240M393 173H527" stroke="#ff5b14" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="460" cy="173" r="17" fill="#ff5b14"/> --><text x="460" y="191" text-anchor="middle" fill="#ff5b14" font-family="Georgia,serif" font-size="54" font-style="italic">L</text><text x="335" y="281" fill="#f4f3f0" font-family="Georgia,serif" font-style="italic" font-size="22">The long walk</text><text x="335" y="307" fill="#707986" font-family="Arial,sans-serif" font-size="11">A sixth of Earth’s weight</text><text x="335" y="325" fill="#707986" font-family="Arial,sans-serif" font-size="11">changes movement.</text><path d="M880 40V347" stroke="#707986" stroke-opacity=".55"/><text x="615" y="67" fill="#707986" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 03</text><circle cx="740" cy="173" r="68" fill="none" stroke="#ff5b14" stroke-opacity=".7" stroke-width="2"/><circle cx="740" cy="173" r="46" fill="none" stroke="#707986" stroke-opacity=".65"/><path d="M740 106V240M673 173H807" stroke="#ff5b14" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="740" cy="173" r="17" fill="#ff5b14"/> --><text x="740" y="191" text-anchor="middle" fill="#ff5b14" font-family="Georgia,serif" font-size="54" font-style="italic">I</text><text x="615" y="281" fill="#f4f3f0" font-family="Georgia,serif" font-style="italic" font-size="22">Into the dark</text><text x="615" y="307" fill="#707986" font-family="Arial,sans-serif" font-size="11">The crater holds a different</text><text x="615" y="325" fill="#707986" font-family="Arial,sans-serif" font-size="11">night.</text><path d="M1160 40V347" stroke="#707986" stroke-opacity=".55"/><text x="895" y="67" fill="#707986" font-family="Arial,sans-serif" font-size="11" letter-spacing="3">CHAPTER 04</text><circle cx="1020" cy="173" r="68" fill="none" stroke="#ff5b14" stroke-opacity=".7" stroke-width="2"/><circle cx="1020" cy="173" r="46" fill="none" stroke="#707986" stroke-opacity=".65"/><path d="M1020 106V240M953 173H1087" stroke="#ff5b14" stroke-opacity=".55"/><!-- ORIGINAL (preserved, not deleted — disabled by comment): <circle cx="1020" cy="173" r="17" fill="#ff5b14"/> --><text x="1020" y="191" text-anchor="middle" fill="#ff5b14" font-family="Georgia,serif" font-size="54" font-style="italic">E</text><text x="895" y="281" fill="#f4f3f0" font-family="Georgia,serif" font-style="italic" font-size="22">Earth day</text><text x="895" y="307" fill="#707986" font-family="Arial,sans-serif" font-size="11">Home returns as a distant blue</text><text x="895" y="325" fill="#707986" font-family="Arial,sans-serif" font-size="11">point.</text></svg>